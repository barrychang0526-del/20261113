
<!DOCTYPE html> <!-- 宣告HTML5文件格式 -->
<html lang="zh-Hant"> <!-- 設定網頁語言為繁體中文 -->

<head> <!-- 開始網頁設定 -->

  <meta charset="UTF-8"> <!-- 設定中文字元編碼 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 支援手機和平板螢幕尺寸 -->

  <title>p5.js 格鬥角色動畫遊戲</title> <!-- 設定網頁標題 -->

  <style> /* 開始設定網頁樣式 */

    html, body { /* 設定整個網頁 */
      margin: 0; /* 移除外邊距 */
      padding: 0; /* 移除內邊距 */
      width: 100%; /* 設定網頁寬度 */
      height: 100%; /* 設定網頁高度 */
      overflow: hidden; /* 隱藏捲動條 */
      background: skyblue; /* 設定天空藍色背景 */
    } /* 結束網頁設定 */

    canvas { /* 設定動畫畫布 */
      display: block; /* 移除畫布下方空白 */
    } /* 結束畫布設定 */

  </style> <!-- 結束網頁樣式 -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script> <!-- 載入p5.js程式庫 -->

  <script src="sketch.js" defer></script> <!-- 載入動畫程式 -->

</head> <!-- 結束網頁設定 -->

<body> <!-- 開始網頁主體 -->

</body> <!-- 結束網頁主體 -->

</html> <!-- 結束HTML文件 -->
